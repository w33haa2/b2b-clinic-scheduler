; Runs Nginx and PHP-FPM in one container, and optionally the queue worker and
; the scheduler alongside them.
;
; RUN_QUEUE and RUN_SCHEDULER default to false. Turn them on to run everything
; in a single service (cheapest), or leave them off and give the queue and the
; scheduler their own services, which is what you want once the app is busy
; enough that a restart of the web service should not interrupt a job.
;
; Running more than one web instance with RUN_SCHEDULER=true would run every
; scheduled command once per instance. Give the scheduler its own single
; service before scaling out.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=www-data

[program:php-fpm]
command=php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.conf
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -c /tmp/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
command=php /var/www/html/artisan queue:work --tries=3 --max-time=3600
autostart=%(ENV_RUN_QUEUE)s
autorestart=true
priority=30
; The worker finishes its current job on SIGQUIT; give it time to do so.
stopsignal=QUIT
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /var/www/html/artisan schedule:work
autostart=%(ENV_RUN_SCHEDULER)s
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
