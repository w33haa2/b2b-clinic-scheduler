# Render Blueprint. Create everything with: Render Dashboard → Blueprints →
# New Blueprint Instance, pointed at this repository.
#
# The database is NOT defined here: it lives in Neon. Paste the Neon
# connection details into DB_* on each service (see docs/docker.md →
# "Deploying to Render").
#
# Three services, all built from the same image (Dockerfile target "render",
# which is the last stage and therefore the default):
#
#   clinic-app        Nginx + PHP-FPM. Runs the migrations on deploy.
#   clinic-queue      php artisan queue:work
#   clinic-scheduler  php artisan schedule:work
#
# To start on one service instead, delete the two workers and set RUN_QUEUE
# and RUN_SCHEDULER to true on clinic-app. See docker/render/supervisord.conf.

services:
    - type: web
      name: clinic-app
      runtime: docker
      plan: starter
      dockerfilePath: ./Dockerfile
      dockerContext: .
      healthCheckPath: /up
      # Render injects PORT; the entrypoint puts it into the Nginx config.
      envVars:
          - key: APP_KEY
            sync: false # php artisan key:generate --show
          - key: APP_NAME
            value: Clinic App
          - key: APP_ENV
            value: production
          - key: APP_DEBUG
            value: 'false'
          - key: APP_URL
            sync: false # the service's real URL, including any -1 suffix
          # ASSET_URL is deliberately absent. It overrides the host for
          # /build/assets/*, and pointing it at the wrong hostname serves a
          # blank page: the HTML asks for the CSS and JS somewhere that
          # answers 404. Left unset, Laravel builds asset URLs from the host
          # the browser actually used, which is right on the onrender.com URL,
          # on preview URLs and on a custom domain alike. Set it only for a CDN.
          - key: LOG_CHANNEL
            value: stderr
          - key: LOG_LEVEL
            value: warning

          # Neon. Use the POOLED host (…-pooler.…) so PHP-FPM children do not
          # exhaust the connection limit, and require TLS.
          - key: DB_CONNECTION
            value: pgsql
          - key: DB_HOST
            sync: false
          - key: DB_PORT
            value: '5432'
          - key: DB_DATABASE
            sync: false
          - key: DB_USERNAME
            sync: false
          - key: DB_PASSWORD
            sync: false
          - key: DB_SSLMODE
            value: require

          # No Redis: Postgres backs the cache, sessions and the queue. Add a
          # Render Key Value instance and switch these to "redis" when the
          # queue gets busy.
          - key: CACHE_STORE
            value: database
          - key: SESSION_DRIVER
            value: database
          - key: QUEUE_CONNECTION
            value: database
          - key: SESSION_LIFETIME
            value: '120'
          - key: SESSION_ENCRYPT
            value: 'true'
          - key: SESSION_SECURE_COOKIE
            value: 'true'

          # Only the web service migrates, and --isolated keeps concurrent
          # deploys from racing each other.
          - key: RUN_MIGRATIONS
            value: 'true'
          - key: RUN_QUEUE
            value: 'false'
          - key: RUN_SCHEDULER
            value: 'false'

          # The first super admin, created on deploy because Render's Shell
          # is a paid feature. The entrypoint stops as soon as one exists, so
          # these are safe to leave set. Delete them once you have signed in.
          - key: SUPER_ADMIN_NAME
            value: Super Admin
          - key: SUPER_ADMIN_EMAIL
            sync: false
          - key: SUPER_ADMIN_PASSWORD
            sync: false # 8+ characters, at least one number

          # Inertia SSR is not deployed here, so pages render in the browser.
          # See docs/docker.md for how to add it back.
          - key: INERTIA_SSR_ENABLED
            value: 'false'

          - key: MAIL_MAILER
            value: smtp
          - key: MAIL_HOST
            sync: false
          - key: MAIL_PORT
            value: '587'
          - key: MAIL_USERNAME
            sync: false
          - key: MAIL_PASSWORD
            sync: false
          - key: MAIL_FROM_ADDRESS
            sync: false
          - key: MAIL_FROM_NAME
            value: Clinic App

    - type: worker
      name: clinic-queue
      runtime: docker
      plan: starter
      dockerfilePath: ./Dockerfile
      dockerContext: .
      dockerCommand: php artisan queue:work --tries=3 --max-time=3600
      envVars:
          - fromGroup: clinic-shared
          - key: RUN_MIGRATIONS
            value: 'false'

    - type: worker
      name: clinic-scheduler
      runtime: docker
      plan: starter
      dockerfilePath: ./Dockerfile
      dockerContext: .
      dockerCommand: php artisan schedule:work
      envVars:
          - fromGroup: clinic-shared
          - key: RUN_MIGRATIONS
            value: 'false'

# The workers need the same configuration as the web service. Put it in an
# environment group in the dashboard once, and both read it from there.
envVarGroups:
    - name: clinic-shared
      envVars:
          - key: APP_KEY
            sync: false
          - key: APP_ENV
            value: production
          - key: APP_DEBUG
            value: 'false'
          - key: APP_URL
            sync: false
          - key: LOG_CHANNEL
            value: stderr
          - key: DB_CONNECTION
            value: pgsql
          - key: DB_HOST
            sync: false
          - key: DB_PORT
            value: '5432'
          - key: DB_DATABASE
            sync: false
          - key: DB_USERNAME
            sync: false
          - key: DB_PASSWORD
            sync: false
          - key: DB_SSLMODE
            value: require
          - key: CACHE_STORE
            value: database
          - key: SESSION_DRIVER
            value: database
          - key: QUEUE_CONNECTION
            value: database
          - key: INERTIA_SSR_ENABLED
            value: 'false'
